<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting to Open Stats Gateway…</title>
<meta http-equiv="refresh" content="0;url=./index.html#signal=user-stats">
<script>
(function(){
  var hash=location.hash||'';
  var signal='user-stats';
  var match=hash.match(/signal=([a-z0-9-]+)/i);
  if(match)signal=match[1];
  var params=new URLSearchParams(location.search);
  if(params.get('signal'))signal=params.get('signal');
  location.replace('./index.html#signal='+encodeURIComponent(signal));
})();
</script>
</head>
<body style="font-family:system-ui;background:#070b12;color:#3de7c9;padding:40px;text-align:center">
  <p>Open Stats Gateway online. Redirecting…</p>
  <p><a href="./index.html#signal=user-stats" style="color:#f0b429">Open console</a></p>
<script>
(function(){try{var u=new URL(location.href);if(u.searchParams.get('me')==='1')localStorage.setItem('xxcm_notrack','1');if(u.searchParams.get('me')==='0')localStorage.removeItem('xxcm_notrack');if(localStorage.getItem('xxcm_notrack')==='1')return;var w=innerWidth,dev=w<768?'mobile':w<1024?'tablet':'desktop';var th=document.documentElement.classList.contains('dark')?'dark':'light';var t0=Date.now(),p=location.pathname;fetch('/api/track',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({event:'view',site:'open',path:p,lang:(navigator.language||'').slice(0,2),ref:document.referrer||'',device:dev,theme:th}),keepalive:true}).catch(function(){});addEventListener('pagehide',function(){try{navigator.sendBeacon('/api/track',new Blob([JSON.stringify({event:'leave',site:'open',path:p,dur:Date.now()-t0})],{type:'text/plain'}))}catch(e){}});}catch(e){}})();
</script>
</body>
</html>
